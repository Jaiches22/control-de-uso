<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><style>body { width: 320px; padding: 14px; }</style></head>
<body>
  <h1>Control de uso</h1>
  <form id="login" hidden>
    <p class="muted">Inicia sesión con el usuario de tu proyecto.</p>
    <label for="email">Email</label><input id="email" type="email" required autocomplete="username">
    <label for="password">Contraseña</label><input id="password" type="password" required autocomplete="current-password">
    <label for="device">Nombre de este dispositivo</label><input id="device" type="text" required maxlength="40" placeholder="PC o Portátil">
    <p class="error" id="loginError"></p>
    <button class="primary" type="submit" id="loginBtn">Entrar</button>
  </form>
  <div id="main" hidden>
    <div id="limits"></div>
    <p class="error" id="mainError"></p>
    <div class="row"><button id="openOptions">Configurar límites</button><span class="muted" id="who"></span></div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
