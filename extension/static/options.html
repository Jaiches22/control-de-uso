<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Control de uso · Límites</title><link rel="stylesheet" href="style.css"><style>body { max-width: 640px; margin: 0 auto; padding: 24px 16px; }</style></head>
<body>
  <h1>Límites diarios</h1>
  <p class="muted">Bajar un límite o añadir webs se aplica al momento. Subirlo, borrarlo o quitar webs entra en vigor a las 00:00. Un límite recién creado se puede corregir durante 10 minutos.</p>
  <p class="error" id="error"></p>
  <div id="list"></div>

  <h2 id="formTitle">Nuevo límite</h2>
  <form id="form" class="card">
    <label for="name">Nombre</label><input id="name" type="text" required maxlength="60" placeholder="Instagram">
    <label for="minutes">Minutos al día</label><input id="minutes" type="number" required min="0" max="1440" step="1" placeholder="12">
    <label for="domains">Webs (dominios separados por comas)</label><input id="domains" type="text" placeholder="instagram.com">
    <label class="check"><input id="shorts" type="checkbox"> YouTube Shorts (solo Shorts; no pongas youtube.com arriba)</label>
    <label class="check"><input id="extra" type="checkbox"> Permitir +5 minutos extra (llegará en la fase 4)</label>
    <p class="muted" id="otherTargets"></p>
    <div class="row"><button class="primary" type="submit" id="save">Guardar</button><button type="button" id="cancelEdit" hidden>Cancelar edición</button></div>
  </form>
  <p class="muted" id="footer"></p>
  <script type="module" src="options.js"></script>
</body>
</html>
