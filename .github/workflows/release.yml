name: Publicar versión

# Se lanza al cambiar el archivo VERSION en main: compila, prueba y publica los instalables en Releases
# con la etiqueta vX.Y.Z correspondiente.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - name: Leer versión
        run: echo "TAG=v$(tr -d '[:space:]' < ../VERSION)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Compilar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VERSION: ${{ env.TAG }}
        run: npm run build
      - name: Empaquetar
        run: cd dist && zip -r "../control-de-uso-extension-${{ env.TAG }}.zip" .
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ env.TAG }}"
          "control-de-uso-extension-${{ env.TAG }}.zip"
          --target "${{ github.sha }}" --title "${{ env.TAG }}" --generate-notes
