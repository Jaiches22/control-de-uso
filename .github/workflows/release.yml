name: Publicar versión

# Se lanza al cambiar el archivo VERSION en main: compila, prueba y publica los instalables en Releases
# con la etiqueta vX.Y.Z correspondiente.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - name: Leer versión
        run: echo "VERSION=$(tr -d '[:space:]' < ../VERSION)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Empaquetar
        run: cd dist && zip -r "../control-de-uso-extension-v$VERSION.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/control-de-uso-extension-v*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Leer versión
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compilar la extensión (va dentro del instalador)
        working-directory: extension
        run: npm ci && npm run build
      - name: Compilar la app
        working-directory: desktop
        run: |
          npm ci
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run typecheck
          npm run build
      - name: Crear el instalador
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

  publicar:
    needs: [extension, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          ls -la out
          gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes
