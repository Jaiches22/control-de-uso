name: Publicar versión

# Se lanza al cambiar el archivo VERSION en main: compila, prueba y publica los instalables en Releases
# con la etiqueta vX.Y.Z correspondiente.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

# Por defecto, solo lectura. Únicamente el paso que publica puede escribir en el repositorio.
permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Leer versión
        run: echo "VERSION=$(tr -d '[:space:]' < ../VERSION)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Empaquetar
        run: cd dist && zip -r "../control-de-uso-extension-v$VERSION.zip" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension
          path: extension/control-de-uso-extension-v*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Leer versión
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Compilar la extensión (va dentro del instalador)
        working-directory: extension
        run: npm ci && npm run build
      - name: Compilar la app
        working-directory: desktop
        run: |
          npm ci
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run typecheck
          npm run build
      - name: Crear el instalador
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never
      - name: Comprobar los fusibles de Electron
        working-directory: desktop
        run: |
          out=$(npx @electron/fuses read --app "release/win-unpacked/Control de uso.exe")
          echo "$out"
          echo "$out" | grep -q "RunAsNode is Disabled"
          echo "$out" | grep -q "EnableNodeCliInspectArguments is Disabled"
          echo "$out" | grep -q "EnableNodeOptionsEnvironmentVariable is Disabled"
          echo "$out" | grep -q "OnlyLoadAppFromAsar is Enabled"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Leer versión
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Compilar el panel web
        working-directory: android/web
        run: npm ci && npm run build
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: 8.10.2
      - name: Preparar la firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Falta el secreto ANDROID_KEYSTORE_BASE64: sin él el APK no se puede firmar." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/firma.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/firma.p12" >> "$GITHUB_ENV"
      - name: Compilar el APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease
      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk "ControlDeUso-$VERSION.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: ControlDeUso-*.apk
          if-no-files-found: error

  publicar:
    needs: [extension, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          ls -la out
          gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes
