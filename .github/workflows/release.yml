name: Publicar versión

# Se lanza al subir una etiqueta vX.Y.Z: compila, prueba y publica los instalables en Releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Compilar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VERSION: ${{ github.ref_name }}
        run: npm run build
      - name: Empaquetar
        run: cd dist && zip -r "../control-de-uso-extension-${{ github.ref_name }}.zip" .
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "control-de-uso-extension-${{ github.ref_name }}.zip"
          --title "${{ github.ref_name }}" --generate-notes
