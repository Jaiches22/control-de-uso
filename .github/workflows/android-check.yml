name: Comprobar Android

# Compila el APK de depuración en cada cambio de la app de Android, para detectar errores antes de publicar.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ['android/**', 'shared/**', '.github/workflows/android-check.yml']

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Compilar el panel web
        working-directory: android/web
        run: npm ci && npm run build
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: 8.10.2
      - name: Compilar el APK de depuración
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
